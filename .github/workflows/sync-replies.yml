# Poll connected mailbox inboxes so replies appear in Activity.
name: Sync replies

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 7-18 * * 1-5"

permissions:
  contents: read

jobs:
  sync-replies:
    runs-on: ubuntu-latest
    steps:
      - name: Call reply sync endpoint
        env:
          REPLY_SYNC_URL: https://opensdoors.bidlow.co.uk/api/internal/replies/sync
          PROCESS_QUEUE_SECRET: ${{ secrets.PROCESS_QUEUE_SECRET }}
        run: |
          if [ -z "${PROCESS_QUEUE_SECRET}" ]; then
            echo "PROCESS_QUEUE_SECRET is not configured; skipping reply sync."
            exit 0
          fi
          response_file="/tmp/reply-sync-response.json"
          status="000"
          if ! status=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$REPLY_SYNC_URL" \
            -H "Authorization: Bearer ${PROCESS_QUEUE_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{"perMailboxTop":25,"maxMailboxes":50}'); then
            curl_exit=$?
            echo "Reply sync curl failed before a valid HTTP response. curl_exit=${curl_exit}"
            status="000"
          fi
          echo "Reply sync HTTP status: ${status}"
          if [ -f "$response_file" ]; then
            cat "$response_file"
          else
            echo "Reply sync response body was not written."
          fi
          # The body is checked as well as the status, and that is not belt and
          # braces. A PARTIAL run answers 207, which IS a 2xx, so a status-only
          # check would pass it — and a status-only check is exactly how a run
          # went green while 8 of 35 mailboxes were failing.
          ok=$(jq -r 'try .ok catch "" ' "$response_file" 2>/dev/null || echo "")
          failed=$(jq -r 'try .failedCount catch 0' "$response_file" 2>/dev/null || echo 0)
          total=$(jq -r 'try .processed catch 0' "$response_file" 2>/dev/null || echo 0)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          if [ "$ok" != "true" ]; then
            echo "Reply sync reported a PARTIAL run: ${failed} item(s) failed."
            echo "reply sync partial: ${failed} of ${total} mailboxes failed" >> /tmp/run-problems.txt
          fi

      # Re-sync every configured do-not-contact sheet so staff additions to
      # the DNC sheets reach the suppression tables — and therefore the
      # send-time gate — without anyone clicking "Sync now". Non-fatal: a
      # broken sheet shows on the suppression page; it must not fail the
      # replies workflow.
      - name: Sync do-not-contact sheets
        env:
          SUPPRESSION_SYNC_URL: https://opensdoors.bidlow.co.uk/api/internal/suppression/sync-all
          PROCESS_QUEUE_SECRET: ${{ secrets.PROCESS_QUEUE_SECRET }}
        run: |
          if [ -z "${PROCESS_QUEUE_SECRET}" ]; then
            echo "PROCESS_QUEUE_SECRET is not configured; skipping DNC sheet sync."
            exit 0
          fi
          status=$(curl -sS -o /tmp/suppression-sync.json -w "%{http_code}" \
            -X POST "$SUPPRESSION_SYNC_URL" \
            -H "Authorization: Bearer ${PROCESS_QUEUE_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}') || status="000"
          echo "DNC sheet sync HTTP status: ${status}"
          cat /tmp/suppression-sync.json 2>/dev/null || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "DNC sheet sync did not succeed (status ${status}); continuing."
          fi

      # A PARTIAL run fails HERE, in a step whose name contains the word, so the
      # alerting can tell "ran and part of it failed" from "did not run at all".
      # Those are different emails and different actions: act today versus act
      # now. Without a distinct step name the alert can only read the run's
      # overall conclusion, which is just "failure", and the PARTIAL subject line
      # — the one that matters — could never be emitted.
      - name: Fail run — PARTIAL
        if: always()
        run: |
          if [ -s /tmp/run-problems.txt ]; then
            echo "This run completed but part of it failed:"
            cat /tmp/run-problems.txt
            # An ::error:: becomes a check annotation, which the REST API
            # exposes. The jobs API gives step NAMES but not their output, so
            # this is how the counts reach the alert — otherwise the subject
            # could only say "failed for 0 items", which tells Greg nothing.
            while IFS= read -r line; do
              echo "::error title=PARTIAL::${line}"
            done < /tmp/run-problems.txt
            exit 1
          fi
          echo "No partial failures recorded."
