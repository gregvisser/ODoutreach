# Poll connected mailbox inboxes so replies appear in Activity.
name: Sync replies

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, ALL hours, ALL days. Greg's decision, 30 August:
    # sending and replying stay inside business hours, but RECEIVING must run
    # at any time. Before this change the cron was `*/15 7-18 * * 1-5`
    # (weekday, 07:00-18:00 UTC only), so a reply landing after 18:00 Friday
    # was invisible on every operator screen until 07:00 Monday - up to 61
    # hours during which the reply-needing-a-person queue stayed empty. This
    # roughly triples the scheduled runs of this workflow, from about 220 a
    # week to 672 - see docs/ops/REPLY-SYNC-ALWAYS-ON-2026-08-30.md for the
    # measured cost and the damage-question investigation that cleared this
    # change. `process-outbound-queue.yml` is deliberately UNCHANGED - sending
    # stays business-hours-only, weekdays. relay/reply-sync-schedule.test.ts
    # proves both facts against the real files.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: odoutreach-reply-and-dnc-sync
  cancel-in-progress: false

jobs:
  sync-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Call reply sync endpoint
        # Azure can own receiving without disabling the protected DNC refresh.
        if: ${{ vars.REPLY_SYNC_RUNNER != 'azure' }}
        env:
          REPLY_SYNC_URL: https://opensdoors.bidlow.co.uk/api/internal/replies/sync
          PROCESS_QUEUE_SECRET: ${{ secrets.PROCESS_QUEUE_SECRET }}
        run: node scripts/run-reply-sync.mjs

      # Re-sync every configured do-not-contact sheet so staff additions to
      # the DNC sheets reach the suppression tables — and therefore the
      # send-time gate — without anyone clicking "Sync now".
      #
      # This step used to check ONLY the HTTP status, which is the same defect
      # the reply-sync step above documents at length. Live proof, run
      # 33002377746 on 2026-08-26: the route answered 207 with
      # `"failed":2,"ok":false` naming two do-not-contact sheets that had
      # stopped updating — and the run went GREEN, so no alert was ever sent.
      # 207 is a 2xx. The body is the only place the truth was.
      #
      # Still non-fatal HERE — one broken sheet must not stop the reply sync —
      # but it is recorded, and the PARTIAL step below turns it into an email.
      # A blocklist that quietly stopped updating is how someone who asked
      # never to be contacted gets contacted.
      - name: Sync do-not-contact sheets
        if: always()
        env:
          SUPPRESSION_SYNC_URL: https://opensdoors.bidlow.co.uk/api/internal/suppression/sync-all
          PROCESS_QUEUE_SECRET: ${{ secrets.PROCESS_QUEUE_SECRET }}
        run: node scripts/run-suppression-sheets.mjs

      # A PARTIAL run fails HERE, in a step whose name contains the word, so the
      # alerting can tell "ran and part of it failed" from "did not run at all".
      # Those are different emails and different actions: act today versus act
      # now. Without a distinct step name the alert can only read the run's
      # overall conclusion, which is just "failure", and the PARTIAL subject line
      # — the one that matters — could never be emitted.
      - name: Fail run — PARTIAL
        if: always()
        run: |
          if [ -s /tmp/run-problems.txt ]; then
            echo "This run completed but part of it failed:"
            cat /tmp/run-problems.txt
            # An ::error:: becomes a check annotation, which the REST API
            # exposes. The jobs API gives step NAMES but not their output, so
            # this is how the counts reach the alert — otherwise the subject
            # could only say "failed for 0 items", which tells Greg nothing.
            while IFS= read -r line; do
              echo "::error title=PARTIAL::${line}"
            done < /tmp/run-problems.txt
            exit 1
          fi
          echo "No partial failures recorded."
