# Production deploy to Azure App Service (Linux, Node 20).
# Authenticates with Microsoft Entra workload identity federation (OIDC) — no publish profile.
# Prerequisites: federated credential on an Entra app (or user-assigned managed identity) + GitHub secrets — see docs/GITHUB_AZURE_OIDC_DEPLOY.md
name: Deploy production (Azure Web App)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production-azure
  cancel-in-progress: true

permissions:
  id-token: write # required for azure/login OIDC
  contents: read

jobs:
  build-and-deploy:
    # Only deploy from main (including manual runs — pick branch "main" in the Actions UI).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Compile-only — same placeholders as CI (real secrets live in Azure App Service configuration).
      AUTH_SECRET: "ci-build-secret-placeholder-min-32-chars-ok"
      AUTH_MICROSOFT_ENTRA_ID_ID: "11111111-1111-1111-1111-111111111111"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "ci-placeholder-client-secret-not-for-production-use"
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: "https://login.microsoftonline.com/22222222-2222-2222-2222-222222222222/v2.0/"
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci_build?schema=public"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      # Production schema: GitHub Actions does not have DATABASE_URL by default.
      # After merging Prisma migrations, either run `npx prisma migrate deploy` once
      # against production (operator session / Kudu) or enable this gated step:
      #   Repository variable: PRODUCTION_PRISMA_MIGRATE = true
      #   Repository secret:    PRODUCTION_DATABASE_URL = (production Postgres URL, never log)
      - name: Prisma migrate deploy (production database)
        if: ${{ vars.PRODUCTION_PRISMA_MIGRATE == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build (webpack — avoids Turbopack workspace-root issue on CI)
        env:
          # Baked into the bundle so /api/build-info reports the live
          # commit + build time at runtime (Azure has no GITHUB_SHA).
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build

      - name: Prune devDependencies for deployment
        run: npm prune --omit=dev

      # Log in immediately before deploy so the OIDC/Azure token lifetime covers deployment only.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-opensdoors-outreach-prod
          resource-group-name: rg-opensdoors-outreach-prod
          package: .

      # BidlowAI Engineering Standard §1.10 — a deploy is not done until it is
      # verified.
      #
      # Liveness alone is NOT enough: for a while after the deploy step returns,
      # Azure is still serving the PREVIOUS build, so a bare /api/health poll
      # passes in seconds against the old instance and proves nothing. So we wait
      # for /api/build-info to report THIS run's commit (stamped from github.sha
      # at build time), and only then assert health — which also covers DB
      # connectivity. This surfaces a bad deploy; it does not roll back.
      - name: Post-deploy health check
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          base="https://app-opensdoors-outreach-prod.azurewebsites.net"
          for attempt in $(seq 1 20); do
            sha=$(curl -fsS --max-time 20 "$base/api/build-info" 2>/dev/null \
              | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "Commit $EXPECTED_SHA is live (attempt $attempt)."
              if ! curl -fsS --max-time 20 "$base/api/health"; then
                echo "::error::New build is live but /api/health did not return success"
                exit 1
              fi
              echo ""
              echo "Post-deploy health check passed."
              exit 0
            fi
            echo "Attempt $attempt: serving ${sha:-unknown}, waiting for $EXPECTED_SHA"
            sleep 20
          done
          echo "::error::$base never reported commit $EXPECTED_SHA — deploy may not have swapped"
          exit 1
