# Autonomous support agent — resolves OPEN ODoutreach support tickets on a schedule.
# Runs scripts/support-agent/grok-support-runner.mjs (xAI Grok chat completions).
# Required secrets: XAI_API_KEY, and for ticket runs SUPPORT_AGENT_DATABASE_URL
# plus SUPPORT_AGENT_GH_TOKEN. The guard fails clearly when required credentials
# are not configured. Do not add a second model vendor, mailbox send credentials,
# or reporter-notification credentials to this workflow.
#
# Activation is two explicit gates, both default-off for scheduled ticket processing:
# 1. GitHub Actions workflow enablement (this file can be disabled_manually in the UI).
# 2. Repository variable SUPPORT_AGENT_SCHEDULE_ENABLED == 'true' before weekday
#    cron processes tickets. Manual authentication-check / process-tickets dispatch
#    does not require that variable, so go-live validation can run first.
# Merging this workflow does not enable either gate and does not process live tickets.
name: Support agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run authentication check or process support tickets"
        type: choice
        options:
          - authentication-check
          - process-tickets
        default: authentication-check
        required: true
  schedule:
    # Hourly, UK business hours, weekdays. Tune the cadence to taste.
    - cron: "0 8-18 * * 1-5"

concurrency:
  group: support-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scheduled-hold:
    if: github.event_name == 'schedule' && vars.SUPPORT_AGENT_SCHEDULE_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Scheduled ticket processing is gated off
        run: |
          set -euo pipefail
          echo "Scheduled support-agent ticket processing is held (default-safe)."
          echo "Manual authentication-check and process-tickets dispatch remain available once this workflow is enabled in the Actions UI."
          echo "To allow weekday cron to process OPEN tickets, set repository variable SUPPORT_AGENT_SCHEDULE_ENABLED=true after docs/ops/SUPPORT-AGENT-GO-LIVE.md."
          echo "This hold does not call the model and does not read tickets."

  resolve-tickets:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.SUPPORT_AGENT_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Guard — required secrets present
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SUPPORT_AGENT_DATABASE_URL: ${{ (github.event_name == 'schedule' || inputs.mode == 'process-tickets') && secrets.SUPPORT_AGENT_DATABASE_URL || '' }}
          SUPPORT_AGENT_GH_TOKEN: ${{ (github.event_name == 'schedule' || inputs.mode == 'process-tickets') && secrets.SUPPORT_AGENT_GH_TOKEN || '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$XAI_API_KEY" ] || missing+=(XAI_API_KEY)
          if [ "${{ github.event_name == 'schedule' || inputs.mode == 'process-tickets' }}" = "true" ]; then
            [ -n "$SUPPORT_AGENT_DATABASE_URL" ] || missing+=(SUPPORT_AGENT_DATABASE_URL)
            [ -n "$SUPPORT_AGENT_GH_TOKEN" ] || missing+=(SUPPORT_AGENT_GH_TOKEN)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Support agent cannot run: missing required secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "Required support-agent credentials are configured."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/heads/main
          # PAT so pushes to `main` trigger the deploy workflow.
          token: ${{ (github.event_name == 'schedule' || inputs.mode == 'process-tickets') && secrets.SUPPORT_AGENT_GH_TOKEN || github.token }}
          persist-credentials: ${{ github.event_name == 'schedule' || inputs.mode == 'process-tickets' }}

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'schedule' || inputs.mode == 'process-tickets'
        run: npm ci

      - name: Run support agent with Grok
        timeout-minutes: 20
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SUPPORT_AGENT_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'process-tickets') && 'process-tickets' || 'authentication-check' }}
          SUPPORT_AGENT_MODEL: ${{ vars.SUPPORT_AGENT_MODEL || 'grok-4.7' }}
          SUPPORT_AGENT_DATABASE_URL: ${{ (github.event_name == 'schedule' || inputs.mode == 'process-tickets') && secrets.SUPPORT_AGENT_DATABASE_URL || '' }}
          GH_TOKEN: ${{ (github.event_name == 'schedule' || inputs.mode == 'process-tickets') && secrets.SUPPORT_AGENT_GH_TOKEN || '' }}
          # Fixed identity via environment avoids mutating runner git config.
          GIT_AUTHOR_NAME: odoutreach-support-agent
          GIT_AUTHOR_EMAIL: support-agent@bidlow.co.uk
          GIT_COMMITTER_NAME: odoutreach-support-agent
          GIT_COMMITTER_EMAIL: support-agent@bidlow.co.uk
        run: node scripts/support-agent/grok-support-runner.mjs
