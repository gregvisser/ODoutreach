# The server selects open client calendars; unset clients retain weekday UTC hours.
name: Process outbound queue

on:
  workflow_dispatch:
  schedule:
    # Backup clock. The Azure WebJob odoutreach-scheduled-outreach is the
    # primary five-minute sender once SCHEDULED_OUTREACH_TIMER=on and three
    # in-window runs have been seen. Set the repository variable
    # SCHEDULED_OUTREACH_RUNNER=azure to skip this schedule. workflow_dispatch
    # still sends. Both paths call the same endpoint; the queue claim and the
    # step-send row lock stop two triggers sending the same email.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: odoutreach-scheduled-outreach
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Old deployments return 404. Never fall back to unscoped endpoints.
      # The runner syncs replies before follow-up advance and queue drain.
      - name: Process open client calendars
        if: ${{ github.event_name == 'workflow_dispatch' || vars.SCHEDULED_OUTREACH_RUNNER != 'azure' }}
        env:
          SCHEDULED_OUTREACH_URL: https://opensdoors.bidlow.co.uk/api/internal/scheduled-outreach/v1
          PROCESS_QUEUE_SECRET: ${{ secrets.PROCESS_QUEUE_SECRET }}
        run: node scripts/run-scheduled-outreach.mjs
