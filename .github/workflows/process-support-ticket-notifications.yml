name: Process support ticket notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: odoutreach-support-ticket-notifications
  cancel-in-progress: false

jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Drain durable notification outbox
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_GRAPH_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
          SUPPORT_AGENT_NOTIFY_SENDER: ${{ secrets.SUPPORT_AGENT_NOTIFY_SENDER }}
        run: npm run support:process-notifications
