# Has a real bounce ever moved OutboundEmail.status to BOUNCED in production?
# READ-ONLY, against PRODUCTION. CR-01b.
#
# The structural defect (only the ESP webhook stamped `status`, so the mailbox
# NDR path suppressed a dead address but never moved the reported bounce rate
# off 0%) was fixed in cycle 39 (PR #279, merged 2026-08-27). What has never
# been checked is whether either channel has actually fired since — "built,
# wired, reporting success, never observed" is this repository's recorded
# worst habit, and a correctly wired flag can still never have seen a real
# event. Scheduled weekly so the answer is re-checked rather than asked once
# and assumed to still hold.
#
# Deliberately NOT a merge-blocking CI job: CI's DATABASE_URL is the ephemeral
# e2e Postgres, which has no real bounce history to report on.
name: Bounce path audit (production)

on:
  workflow_dispatch:
  schedule:
    # Monday 06:30 UTC — after the mailbox credential probe (06:15), before
    # the weekday send window opens at 07:00.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Bounce path audit
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "PRODUCTION_DATABASE_URL is not configured — refusing to report a clean audit against no database."
            exit 1
          fi
          npm run ops:bounce-path-audit
