# Manual, one-off: grant the F2 super-admin capability to a staff account.
#
# Why a workflow: the production database is only reachable through the
# `PRODUCTION_DATABASE_URL` secret (the same one the deploy uses for
# migrations). This runs ONE idempotent, parameterised UPDATE — it only ever
# sets isSuperAdmin = true, never revokes and never deletes. It prints the
# StaffUser table before and after so the result is auditable in the run log.
#
# Run it from the Actions tab → "Grant super-admin" → Run workflow → enter the
# staff email. Safe to re-run (idempotent). Email match is case-insensitive and
# trimmed; if no row matches it fails loudly and changes nothing.
name: Grant super-admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Staff email to grant super-admin (case-insensitive)"
        required: true
        default: "greg@bidlow.co.uk"

permissions: {}

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Grant super-admin (idempotent)
        env:
          PGURL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          TARGET_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          if [ -z "${PGURL:-}" ]; then
            echo "ERROR: PRODUCTION_DATABASE_URL secret is not set."; exit 1
          fi
          echo "== StaffUser (before) =="
          psql "$PGURL" -c 'SELECT id, email, role, "isSuperAdmin" FROM "StaffUser" ORDER BY email;'
          echo "== Granting super-admin to: ${TARGET_EMAIL} =="
          granted=$(psql "$PGURL" -v em="$TARGET_EMAIL" -tAc \
            "UPDATE \"StaffUser\" SET \"isSuperAdmin\" = true \
             WHERE lower(trim(email)) = lower(trim(:'em')) RETURNING email;")
          if [ -z "$granted" ]; then
            echo "ERROR: no StaffUser matched '${TARGET_EMAIL}'. See the list above; no change was made."
            exit 1
          fi
          echo "Granted super-admin to: ${granted}"
          echo "== StaffUser (after) =="
          psql "$PGURL" -c 'SELECT id, email, role, "isSuperAdmin" FROM "StaffUser" ORDER BY email;'
