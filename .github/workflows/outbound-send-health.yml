# Read-only send health. No schedule, no send, no campaign change.
name: Outbound send health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print per-client send health
        env:
          SEND_HEALTH_URL: https://app-opensdoors-outreach-prod.azurewebsites.net/api/internal/outbound/send-health
          PROCESS_QUEUE_SECRET: ${{ secrets.PROCESS_QUEUE_SECRET }}
        run: |
          if [ -z "${PROCESS_QUEUE_SECRET}" ]; then
            echo "PROCESS_QUEUE_SECRET is not configured; cannot ask."
            exit 1
          fi

          response_file="/tmp/send-health.json"
          status=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X GET "$SEND_HEALTH_URL" \
            -H "Authorization: Bearer ${PROCESS_QUEUE_SECRET}") || status="000"

          echo "HTTP status: ${status}"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Send health could not be read."
            exit 1
          fi

          echo
          echo "Waiting is QUEUED + PROCESSING + REQUESTED + PREPARING."
          echo "Ages are minutes. Sent, failed and mailbox bookings use the UTC day."
          echo "Due follow-ups are READY follow-ups whose delay has elapsed."
          echo
          jq -r '
            (["CLIENT","STATUS","WAITING","QUEUED","PROCESSING","OLDEST QUEUED MIN","OLDEST PROCESSING MIN","SENT TODAY","FAILED TODAY","DUE FOLLOW-UPS"] | @tsv),
            (.clients[] | [
              .client,
              .lifecycle,
              (.waiting | tostring),
              ((.outboundByStatus.QUEUED // 0) | tostring),
              ((.outboundByStatus.PROCESSING // 0) | tostring),
              (.oldestQueuedMinutes // "-" | tostring),
              (.oldestProcessingMinutes // "-" | tostring),
              (.sentToday | tostring),
              (.failedTodayCount | tostring),
              (.dueFollowUps | tostring)
            ] | @tsv)
          ' "$response_file" | column -t -s $'\t'

          echo
          echo "Mailbox cap usage (booked today / cap):"
          jq -r '
            .clients[] | . as $c | .mailboxes[] |
            "\($c.client)  \(.mailbox)  \(.bookedToday)/\(.cap)  connected=\(.connected)  sending=\(.sendingEnabled)"
          ' "$response_file"

          echo
          echo "Failed today:"
          jq -r '
            .clients[] | . as $c | .failedToday[] |
            "\($c.client)  \(.count)  \(.reason)"
          ' "$response_file"

          echo
          echo "Held:"
          jq -r '
            .clients[] | . as $c | .held[] |
            "\($c.client)  \(.count)  \(.reason)"
          ' "$response_file"
