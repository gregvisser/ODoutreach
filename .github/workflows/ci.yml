# Install, lint, validate schema, and build. Uses placeholder Entra env for compile-only CI - not real auth.
# Build runs `next build --webpack` (see package.json) for a consistent production bundle on all platforms.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: "ci-build-secret-placeholder-min-32-chars-ok"
      AUTH_MICROSOFT_ENTRA_ID_ID: "11111111-1111-1111-1111-111111111111"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "ci-placeholder-client-secret-not-for-production-use"
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: "https://login.microsoftonline.com/22222222-2222-2222-2222-222222222222/v2.0/"
      # Prisma is imported during `next build` page-data collection - URL is compile-only (no DB required on runners).
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci_build?schema=public"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=vitest-results.json

      # The ship gate reads .bidlow/EVIDENCE.json and refuses to accept "the tests
      # passed" written by the same agent that wrote the code. Nothing was writing
      # that file, so the gate's central assumption was false. This step is the
      # missing producer: it records what ACTUALLY ran, from vitest's own
      # machine-readable output, and uploads it so the record is independent of
      # whoever asserts it. `if: always()` so a RED run is recorded as red rather
      # than leaving no evidence at all.
      - name: Record unit-test evidence
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let r = null;
            try { r = JSON.parse(fs.readFileSync("vitest-results.json", "utf8")); } catch {}
            const suite = r
              ? { name: "vitest (unit + integration)", command: "npm run test:coverage",
                  passed: r.success === true && r.numFailedTests === 0,
                  count: r.numTotalTests, failed: r.numFailedTests, files: r.numTotalTestSuites }
              : { name: "vitest (unit + integration)", command: "npm run test:coverage",
                  passed: false, count: 0, failed: null,
                  note: "no machine-readable result was produced - a check that cannot run is a failure, not a pass" };
            fs.writeFileSync("evidence-unit.json", JSON.stringify(
              { commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
                recorded_by: "github-actions", suites: [suite] }, null, 2));
            console.log(JSON.stringify(suite));
          '

      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-unit
          path: evidence-unit.json
          retention-days: 30

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e_local_only
          POSTGRES_DB: odoutreach_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway database, and the only DB this job can reach. NOTE: no provider
      # secrets are defined here — `e2e/env.ts` additionally blanks them for the
      # app under test, so a real send is impossible.
      E2E_DATABASE_URL: "postgresql://e2e:e2e_local_only@localhost:5434/odoutreach_e2e?schema=public"
      DATABASE_URL: "postgresql://e2e:e2e_local_only@localhost:5434/odoutreach_e2e?schema=public"
      AUTH_SECRET: "e2e-only-not-a-production-secret-min-32-chars"
      E2E_AUTH_SECRET: "e2e-only-not-a-production-secret-min-32-chars"
      AUTH_MICROSOFT_ENTRA_ID_ID: "11111111-1111-1111-1111-111111111111"
      AUTH_MICROSOFT_ENTRA_ID_SECRET: "e2e-placeholder-not-a-real-secret"
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: "https://login.microsoftonline.com/22222222-2222-2222-2222-222222222222/v2.0/"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply schema to the e2e database
        run: npx prisma migrate deploy

      # Real Prisma against a real schema — covers the src/server orchestration
      # that mock-based unit tests cannot cover honestly. Runs before the build
      # so a data-layer regression fails fast.
      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run test:e2e -- --reporter=json > playwright-results.json

      # Same contract as the unit job. `if: always()` matters more here: the e2e
      # suite is currently RED on BC-01 tenant isolation, and the whole point of
      # recording evidence is that a red run leaves a record saying so.
      - name: Record e2e evidence
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let r = null;
            try { r = JSON.parse(fs.readFileSync("playwright-results.json", "utf8")); } catch {}
            const st = r && r.stats;
            const suite = st
              ? { name: "playwright (e2e)", command: "npm run test:e2e",
                  passed: (st.unexpected || 0) === 0,
                  count: (st.expected || 0) + (st.unexpected || 0), failed: st.unexpected || 0 }
              : { name: "playwright (e2e)", command: "npm run test:e2e",
                  passed: false, count: 0, failed: null,
                  note: "no machine-readable result was produced - a check that cannot run is a failure, not a pass" };
            fs.writeFileSync("evidence-e2e.json", JSON.stringify(
              { commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
                recorded_by: "github-actions", suites: [suite] }, null, 2));
            console.log(JSON.stringify(suite));
          '

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-e2e
          path: evidence-e2e.json
          retention-days: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
