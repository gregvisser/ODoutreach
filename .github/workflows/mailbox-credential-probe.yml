# Is any live mailbox stranded by an abandoned Connect? READ-ONLY, against PRODUCTION.
#
# Deliberately NOT a merge-blocking CI job, for the same reason as the signature
# link audit: CI's DATABASE_URL is the ephemeral e2e Postgres, which has no
# clients and no mailboxes. This job would pass on an empty database and report
# a clean bill of health — a false green, which is a named defect class here.
#
# The probe writes nothing, sends nothing and deletes nothing. It exists because
# unit tests prove the rule over fixtures, and fixtures cannot say whether a
# mailbox is off the air in production this morning.
name: Mailbox credential probe (production)

on:
  workflow_dispatch:
  schedule:
    # Monday 06:15 UTC — after the signature link audit, before the weekday
    # send window opens at 07:00, so a stranded mailbox is found while there is
    # still time to reconnect it before the day's sends.
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Mailbox credential probe
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "PRODUCTION_DATABASE_URL is not configured — refusing to report a clean probe against no database."
            exit 1
          fi
          npm run ops:mailbox-credential-probe
